<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>희래등 메뉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 중화요리집 붉은 바탕 위에 금테 메뉴판 한 장. 표지(차림표) → 탭 한 번 → 공개 화면. 단일 테마. */
:root {
  color-scheme: light;
  --indigo: #8a1a1a;       /* 바탕 홍색 */
  --indigo-deep: #5c0f10;
  --paper: #fbf5e6;        /* 메뉴판 종이 */
  --ink: #2b1a14;          /* 본문 먹색 */
  --ink-soft: #7a6253;
  --seal: #b3201f;         /* 홍색 (강조) */
  --line: #c9a24a;        /* 금테 */
  --font-display: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --font-kid: "Gaegu", "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;   /* 아이 손글씨 */
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--indigo);
  background-image: radial-gradient(circle at 50% 0%, #b02a25 0%, var(--indigo) 45%, var(--indigo-deep) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 19px;
  line-height: 1.6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  -webkit-text-size-adjust: 100%;
}
.sheet {
  position: relative;
  width: 100%;
  max-width: 440px;
  background: var(--paper);
  border-radius: 4px;
  padding: 40px 28px 36px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
  text-align: center;
}
.sheet::before {            /* 차림표 안쪽 겹테두리 */
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid var(--line);
  outline: 1px solid var(--line);
  outline-offset: -5px;
  pointer-events: none;
}
[hidden] { display: none !important; }

/* 표지 */
.eyebrow {
  font-size: 15px;
  letter-spacing: .35em;
  text-indent: .35em;
  color: var(--ink-soft);
  margin: 0;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 52px;
  letter-spacing: .18em;
  text-indent: .18em;
  margin: 6px 0 0;
  text-wrap: balance;
}
.sub { font-family: var(--font-display); font-size: 18px; letter-spacing: .2em; text-indent: .2em; color: var(--seal); margin: 8px 0 0; }
.rule {
  width: 56px; height: 1px;
  background: var(--ink);
  margin: 22px auto;
  border: 0;
}
.item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 22px;
  margin: 0 6px;
}
.item .dots { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-5px); }
.item .tag { color: var(--seal); font-weight: 700; }
.note { color: var(--ink-soft); font-size: 17px; margin: 14px 0 28px; }
.open {
  appearance: none;
  width: 100%;
  border: 0;
  border-radius: 4px;
  background: var(--seal);
  color: #ffe9a8;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 24px;
  padding: 18px 12px;
  cursor: pointer;
  box-shadow: 0 4px 0 #7a1414;
}
.open:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1414; }
.open:focus-visible, .photo:focus-visible { outline: 3px solid #2b1a14; outline-offset: 3px; }
.hint { font-size: 15px; color: var(--ink-soft); margin: 14px 0 0; }

/* 공개 화면 */
.photo {
  margin: 0 auto 26px;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: #10151d;
  border: 8px solid #fff;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transform: rotate(-1.5deg);
}
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .placeholder { color: #8f9aad; font-size: 16px; padding: 12px; }
.message {
  font-family: var(--font-kid);
  font-weight: 700;
  font-size: 40px;
  line-height: 1.3;
  margin: 0;
  text-wrap: balance;
  word-break: keep-all;
}
.message .call { color: var(--seal); display: block; }
.meet {
  font-family: var(--font-kid);
  font-weight: 700;
  font-size: 32px;
  line-height: 1.3;
  margin: 14px 0 0;
  color: var(--ink);
}
.sheep { display: block; width: 132px; height: auto; margin: 18px auto 0; }
.wobble .w { display: inline-block; white-space: nowrap; }
.wobble .c { display: inline-block; }
.sign {
  font-family: var(--font-kid);
  font-weight: 700;
  font-size: 28px;
  margin: 6px 0 0;
  color: var(--ink);
}

#reveal .photo, #reveal .message, #reveal .meet, #reveal .sheep, #reveal .sign { animation: rise .9s ease-out both; }
#reveal .message { animation-delay: .5s; }
#reveal .meet { animation-delay: 1.1s; }
#reveal .sheep, #reveal .sign { animation-delay: 1.6s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; } }
#reveal .photo { animation-name: risePhoto; }
@keyframes risePhoto { from { opacity: 0; transform: translateY(14px) rotate(-1.5deg) scale(.96); } to { opacity: 1; transform: rotate(-1.5deg); } }

#petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

@media (max-width: 360px) {
  h1 { font-size: 34px; }
  .message { font-size: 33px; }
  .meet { font-size: 27px; }
  .sheet { padding: 34px 22px 30px; }
}
@media (prefers-reduced-motion: reduce) {
  #reveal .photo, #reveal .message, #reveal .meet, #reveal .sheep, #reveal .sign { animation: none; }
}
</style>
</head>
<body>

<main class="sheet">
  <!-- 표지: 식당 메뉴판처럼 보이는 화면 -->
  <section id="cover">
    <p class="eyebrow">중화요리</p>
    <h1>희래등</h1>
    <p class="sub">메뉴 · MENU</p>
    <hr class="rule">
    <div class="item"><span>오늘의 특선 요리</span><span class="dots"></span><span class="tag">단 하나</span></div>
    <p class="note">오래 정성 들여 준비했습니다.</p>
    <button class="open" id="open" type="button">특선 요리 보기</button>
    <p class="hint">위 빨간 버튼을 눌러 주세요</p>
  </section>

  <!-- 공개 화면 -->
  <section id="reveal" hidden>
    <div class="photo" id="photo" tabindex="-1">
      <img src="photo.jpg" alt="복동이 초음파 사진" width="1200" height="900">
    </div>
    <p class="message wobble"><span class="call">할아버지, 할머니</span>얼른 보고 싶어요.</p>
    <p class="meet wobble">내년 7월에 만나요~</p>
    <svg class="sheep" viewBox="0 0 160 126" role="img" aria-label="붉은 양">
      <rect x="62" y="92" width="10" height="26" rx="5" fill="#5a3a32"/>
      <rect x="100" y="92" width="10" height="26" rx="5" fill="#5a3a32"/>
      <circle cx="141" cy="70" r="9" fill="#e2645a"/>
      <g fill="#d9463f">
        <circle cx="60" cy="72" r="23"/><circle cx="78" cy="52" r="23"/><circle cx="104" cy="50" r="23"/>
        <circle cx="122" cy="70" r="23"/><circle cx="104" cy="88" r="22"/><circle cx="78" cy="89" r="22"/>
        <circle cx="90" cy="70" r="27"/>
      </g>
      <g fill="#e9736a"><circle cx="96" cy="56" r="5"/><circle cx="112" cy="72" r="4"/><circle cx="86" cy="80" r="4"/></g>
      <ellipse cx="22" cy="60" rx="10" ry="6" transform="rotate(-25 22 60)" fill="#f1c7a8"/>
      <ellipse cx="70" cy="58" rx="10" ry="6" transform="rotate(25 70 58)" fill="#f1c7a8"/>
      <ellipse cx="46" cy="66" rx="22" ry="20" fill="#fdebd9"/>
      <g fill="#d9463f"><circle cx="35" cy="48" r="9"/><circle cx="46" cy="44" r="11"/><circle cx="57" cy="48" r="9"/></g>
      <circle cx="38" cy="66" r="3" fill="#2b1a14"/><circle cx="54" cy="66" r="3" fill="#2b1a14"/>
      <circle cx="39" cy="65" r="1" fill="#fff"/><circle cx="55" cy="65" r="1" fill="#fff"/>
      <circle cx="31" cy="74" r="4.5" fill="#f6a5a0"/><circle cx="61" cy="74" r="4.5" fill="#f6a5a0"/>
      <path d="M42 74 q4 4 8 0" fill="none" stroke="#2b1a14" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p class="sign wobble">복동이 올림</p>
  </section>
</main>

<canvas id="petals" aria-hidden="true"></canvas>

<script>
(function () {
  var cover = document.getElementById('cover');
  var reveal = document.getElementById('reveal');
  var canvas = document.getElementById('petals');

  // 글자마다 기울기와 높이를 조금씩 달리해 아이가 쓴 것처럼 삐뚤빼뚤하게
  var n = 0;
  function wobble(node) {
    var kids = Array.prototype.slice.call(node.childNodes);
    kids.forEach(function (k) {
      if (k.nodeType === 1) { wobble(k); return; }
      if (k.nodeType !== 3) return;
      var frag = document.createDocumentFragment();
      k.textContent.split(/(\s+)/).forEach(function (word) {
        if (!word) return;
        if (/^\s+$/.test(word)) { frag.appendChild(document.createTextNode(' ')); return; }
        var w = document.createElement('span'); w.className = 'w';
        Array.from(word).forEach(function (ch) {
          var c = document.createElement('span'); c.className = 'c'; c.textContent = ch;
          n++;
          var rot = ((n * 37) % 13) - 6;            // -6 ~ 6도
          var dy = ((n * 53) % 9) - 4;              // -4 ~ 4px
          var sc = 0.94 + ((n * 29) % 13) / 100;    // 0.94 ~ 1.06배
          c.style.transform = 'translateY(' + dy + 'px) rotate(' + rot + 'deg) scale(' + sc + ')';
          w.appendChild(c);
        });
        frag.appendChild(w);
      });
      node.replaceChild(frag, k);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.wobble'), wobble);

  document.getElementById('open').addEventListener('click', function () {
    cover.hidden = true;
    reveal.hidden = false;
    document.getElementById('photo').focus({ preventScroll: true });
    window.scrollTo(0, 0);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) petals();
  });

  // 꽃잎이 8초쯤 흩날리다 멈춘다
  function petals() {
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h;
    function size() {
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    window.addEventListener('resize', size);
    var colors = ['#f4b8c0', '#ffe9a8', '#ffffff', '#e8c36a', '#f7d7dc'];
    var list = [];
    for (var i = 0; i < 70; i++) {
      list.push({
        x: Math.random() * w,
        y: -20 - Math.random() * h * 0.9,
        r: 5 + Math.random() * 6,
        vy: 1.2 + Math.random() * 2,
        sway: Math.random() * Math.PI * 2,
        spin: Math.random() * Math.PI,
        c: colors[i % colors.length]
      });
    }
    var start = performance.now();
    function frame(now) {
      var t = now - start;
      ctx.clearRect(0, 0, w, h);
      var alive = false;
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        p.y += p.vy;
        p.sway += 0.03;
        p.spin += 0.04;
        var x = p.x + Math.sin(p.sway) * 22;
        if (p.y < h + 20) alive = true;
        else if (t < 5500) { p.y = -20; alive = true; }
        ctx.save();
        ctx.translate(x, p.y);
        ctx.rotate(p.spin);
        ctx.fillStyle = p.c;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      if (alive) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
